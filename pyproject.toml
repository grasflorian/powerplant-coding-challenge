[project]
name = "powerplant-app"
version = "0.1.0"
description = "Coding challenge"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.117.1",
    "uvicorn>=0.37.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = [
  "src"
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[project.scripts]
serve = "powerplant_app.main:main"